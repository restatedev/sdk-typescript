[package]
name = "restate-sdk-shared-core-native"
version = "0.1.0"
authors = ["Restate Software, Inc., Restate GmbH"]
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep this in lockstep with sdk-shared-core-wasm-bindings/Cargo.toml so the
# native and WASM builds are functionally identical.
restate-sdk-shared-core = { version = "7.0.2", features = ["request_identity", "rust_crypto", "tracing_pretty"] }
napi = { version = "2", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
